<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>RF · moire</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }
    #canvas-container { position: fixed; inset: 0; }

    /* HUD — bottom left, small, dim */
    #hud {
      position: fixed;
      bottom: 1.4em;
      left: 1.4em;
      color: rgba(255,255,255,0.18);
      font-size: 0.58em;
      letter-spacing: 0.14em;
      line-height: 2em;
      text-transform: uppercase;
      pointer-events: none;
    }
    #hud span { color: rgba(255,255,255,0.45); }

    /* Legend — bottom right */
    #legend {
      position: fixed;
      bottom: 1.4em;
      right: 1.4em;
      color: rgba(255,255,255,0.15);
      font-size: 0.55em;
      letter-spacing: 0.1em;
      line-height: 2em;
      text-transform: uppercase;
      text-align: right;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="hud">
    <div>TEMP <span id="temp-val">--</span> °C</div>
    <div>BASE <span id="base-val">--</span> °C</div>
    <div>DELTA <span id="delta-val">--</span></div>
    <div>RH <span id="rh-val">--</span> %</div>
    <div>WS <span id="ws-val">--</span></div>
  </div>

  <div id="legend">
    <div>Layer A — baseline grid</div>
    <div>Layer B — sensor grid</div>
    <div>Rotation ← temperature delta</div>
    <div>Dot density ← humidity</div>
    <div>Interference ← correlation</div>
  </div>

  <script>
  // ═══════════════════════════════════════════════════
  // STATE
  // ═══════════════════════════════════════════════════

  const state = {
    // Temperature from Supabase / ESP32
    tempC: null,
    rhPct: null,

    // Baseline — rolling 30-sample average of temp
    // Represents "what this space normally is"
    baseline: null,
    baselineHistory: [],
    BASELINE_WINDOW: 30,

    // Derived
    delta: 0,       // temp - baseline, drives rotation
    deltaNorm: 0,   // normalized delta for visual mapping

    // WebSocket
    wsConnected: false
  };

  // ─── Baseline tracking ────────────────────────────
  // Rolling average — "memory" of what normal looks like

  function updateBaseline(temp) {
    state.baselineHistory.push(temp);
    if (state.baselineHistory.length > state.BASELINE_WINDOW) {
      state.baselineHistory.shift();
    }
    const sum = state.baselineHistory.reduce((a, b) => a + b, 0);
    state.baseline = sum / state.baselineHistory.length;
  }

  // ═══════════════════════════════════════════════════
  // WEBSOCKET — receive sensor data from Pi router
  // ═══════════════════════════════════════════════════

  const host = location.host || 'adrian-pi.tailc1f637.ts.net:3000';
  const ws = new WebSocket(`wss://${host}`);
  
  ws.onopen = () => {
    state.wsConnected = true;
    document.getElementById('ws-val').textContent = 'connected';
  };

  ws.onclose = () => {
    state.wsConnected = false;
    document.getElementById('ws-val').textContent = 'disconnected';
  };

  ws.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);

      if (data.type === 'sensor' && data.name === 'esp32-am2320') {
        if (data.param === 'temp_c' && data.value !== null) {
          state.tempC = data.value;
          updateBaseline(data.value);

          if (state.baseline !== null) {
            state.delta = state.tempC - state.baseline;
            // Map delta to rotation: ±3°C → ±30° rotation
            // Clamp and normalize
            state.deltaNorm = Math.max(-1, Math.min(1, state.delta / 3.0));
          }

          document.getElementById('temp-val').textContent  = data.value.toFixed(2);
          document.getElementById('base-val').textContent  = state.baseline ? state.baseline.toFixed(2) : '--';
          document.getElementById('delta-val').textContent = state.delta.toFixed(3);
        }

        if (data.param === 'rh' && data.value !== null) {
          state.rhPct = data.value;
          document.getElementById('rh-val').textContent = data.value.toFixed(1);
        }
      }
    } catch (e) {
      // ignore
    }
  };

  // ═══════════════════════════════════════════════════
  // MOIRE MATHEMATICS
  //
  // A moire pattern emerges from the interference of two
  // regular or semi-regular dot grids.
  //
  // Layer A: baseline grid — fixed, represents "normal"
  // Layer B: sensor grid   — rotated by temperature delta
  //
  // When delta = 0 (temp = baseline), grids are aligned.
  // Dots overlap perfectly. Pattern appears uniform.
  //
  // When delta ≠ 0 (temp deviates from baseline), Layer B
  // rotates. The interference reveals moiré fringes —
  // bands of density that are literally the correlation
  // structure between the two states.
  //
  // The fringe spacing and orientation encode the magnitude
  // and direction of the deviation.
  //
  // Adding quasi-random perturbation to dot positions
  // (controlled by humidity) introduces noise with memory —
  // the dots are not purely regular but not purely random.
  // ═══════════════════════════════════════════════════

  new p5((p) => {
    // Grid parameters
    const GRID_SPACING = 18;   // pixels between dots (base)
    const DOT_RADIUS   = 1.8;  // dot size
    const CANVAS_W     = () => p.windowWidth;
    const CANVAS_H     = () => p.windowHeight;

    // Smoothed rotation angle — interpolate toward target
    let angleSmoothed = 0;
    let densitySmoothed = 1.0;

    // Noise offset for quasi-random perturbation
    let noiseT = 0;

    // Graphics buffers — prerender each layer
    let bufA, bufB;
    let needsRedraw = true;
    let lastDelta = null;
    let lastRH = null;

    p.setup = () => {
      const cnv = p.createCanvas(CANVAS_W(), CANVAS_H());
      cnv.parent('canvas-container');
      p.colorMode(p.RGB, 255, 255, 255, 255);
      p.noLoop(); // draw only when data changes
      p.frameRate(30);

      bufA = p.createGraphics(CANVAS_W(), CANVAS_H());
      bufB = p.createGraphics(CANVAS_W(), CANVAS_H());

      // Start loop — we'll control redraw via needsRedraw
      p.loop();
    };

    p.windowResized = () => {
      p.resizeCanvas(CANVAS_W(), CANVAS_H());
      bufA = p.createGraphics(CANVAS_W(), CANVAS_H());
      bufB = p.createGraphics(CANVAS_W(), CANVAS_H());
      needsRedraw = true;
    };

    // ── Draw a dot grid onto a graphics buffer ────────
    // angle: rotation of the grid around canvas center
    // spacing: grid spacing
    // noiseAmt: how much quasi-random perturbation to add
    // dotR: dot radius

    function drawGrid(buf, angle, spacing, noiseAmt, dotR, col) {
      buf.clear();
      buf.noStroke();
      buf.fill(...col);

      const cx = buf.width  / 2;
      const cy = buf.height / 2;

      // How many dots we need to cover the canvas even when rotated
      const diagonal = Math.sqrt(buf.width * buf.width + buf.height * buf.height);
      const count = Math.ceil(diagonal / spacing) + 2;

      const cosA = Math.cos(angle);
      const sinA = Math.sin(angle);

      for (let ix = -count; ix <= count; ix++) {
        for (let iy = -count; iy <= count; iy++) {
          // Grid position (before rotation)
          let gx = ix * spacing;
          let gy = iy * spacing;

          // Quasi-random perturbation — p5 noise is 1/f by design
          // This introduces colored noise into the dot positions
          // The noise is seeded by grid position so it's stable
          if (noiseAmt > 0) {
            const nx = p.noise(ix * 0.3 + noiseT, iy * 0.3) - 0.5;
            const ny = p.noise(ix * 0.3, iy * 0.3 + noiseT + 100) - 0.5;
            gx += nx * noiseAmt * spacing;
            gy += ny * noiseAmt * spacing;
          }

          // Rotate around center
          const rx = cosA * gx - sinA * gy + cx;
          const ry = sinA * gx + cosA * gy + cy;

          // Clip — only draw if on canvas
          if (rx > -spacing && rx < buf.width  + spacing &&
              ry > -spacing && ry < buf.height + spacing) {
            buf.ellipse(rx, ry, dotR * 2, dotR * 2);
          }
        }
      }
    }

    p.draw = () => {
      // Smooth the angle and density toward targets
      const targetAngle = (Math.PI / 72) + state.deltaNorm * (Math.PI / 6); // 2.5° base + ±30°
      const targetDensity = state.rhPct
        ? 0.6 + (state.rhPct / 100) * 0.8  // 0.6 - 1.4× spacing
        : 1.0;

      const prevAngle   = angleSmoothed;
      const prevDensity = densitySmoothed;

      angleSmoothed   += (targetAngle   - angleSmoothed)   * 0.04;
      densitySmoothed += (targetDensity - densitySmoothed) * 0.04;

      // Advance noise time slowly — this creates slow drift
      // in the perturbation field, like 1/f temporal evolution
      noiseT += 0.002;

      // Only redraw grids when values change meaningfully
      const angleDiff   = Math.abs(angleSmoothed - prevAngle);
      const densityDiff = Math.abs(densitySmoothed - prevDensity);
      needsRedraw = angleDiff > 0.0001 || densityDiff > 0.001 || needsRedraw;

      if (!needsRedraw) return;
      needsRedraw = false;

      p.background(0);

      // ── Humidity → noise amount ───────────────────
      // Dry air = pure regular grid (white noise equivalent)
      // Humid air = perturbed grid (colored noise, has memory)
      const noiseAmt = state.rhPct
        ? (state.rhPct - 20) / 80  // 0 at 20% RH, 1 at 100% RH
        : 0.15;

      // ── Layer A — baseline grid (fixed, white) ────
      // Represents the normal state of this space
      drawGrid(bufA, 0, GRID_SPACING * densitySmoothed, 0, DOT_RADIUS,
               [255, 255, 255, 180]);

      // ── Layer B — sensor grid (rotated, cyan tint) ─
      // Rotated by temperature delta from baseline
      // When aligned with A: space is at baseline temperature
      // When rotated: space has deviated — correlation breaks down
      drawGrid(bufB, angleSmoothed, GRID_SPACING * densitySmoothed, noiseAmt, DOT_RADIUS,
               [120, 220, 200, 150]);

      // ── Composite — multiply blend ────────────────
      // Where both layers have dots: bright (correlation)
      // Where only one layer: medium (partial)
      // Where neither: dark (anti-correlation)
      // This is the moire interference pattern

      p.blendMode(p.ADD);
      p.image(bufA, 0, 0);
      p.image(bufB, 0, 0);
      p.blendMode(p.BLEND);

      // ── Vignette ──────────────────────────────────
      // Focuses attention on center where pattern is clearest
      const cx = p.width / 2;
      const cy = p.height / 2;
      const r  = Math.min(cx, cy) * 1.2;
      const g  = p.drawingContext.createRadialGradient(cx, cy, r * 0.3, cx, cy, r);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,0.7)');
      p.drawingContext.fillStyle = g;
      p.drawingContext.fillRect(0, 0, p.width, p.height);

    // Draw baseline history trace
    if (state.baselineHistory.length > 1) {
    p.noFill();
    p.stroke(255, 255, 255, 30);
    p.strokeWeight(1);
    p.beginShape();
    const traceW = p.width * 0.3;
    const traceH = 40;
    const traceX = p.width / 2 - traceW / 2;
    const traceY = 40;
    const tempRange = 2; // ±1°C shown
    state.baselineHistory.forEach((t, i) => {
        const x = traceX + (i / state.BASELINE_WINDOW) * traceW;
        const y = traceY + (0.5 - (t - state.baseline) / tempRange) * traceH;
        p.curveVertex(x, y);
    });
    p.endShape();

    // Current temp dot on trace
    p.noStroke();
    p.fill(120, 220, 200, 150);
    const cx = traceX + traceW;
    const cy = traceY + (0.5 - (state.tempC - state.baseline) / tempRange) * traceH;
    p.ellipse(cx, cy, 4, 4);
    }

      // ── Delta annotation ──────────────────────────
      // Show the rotation angle and delta value
      // Only when we have real data
      if (state.tempC !== null && state.baseline !== null) {
        p.fill(255, 255, 255, 25);
        p.noStroke();
        p.textFont('Courier New');
        p.textSize(10);
        p.textAlign(p.CENTER);

        const deg = (angleSmoothed * 180 / Math.PI).toFixed(2);
        p.text(
          `Δ ${state.delta >= 0 ? '+' : ''}${state.delta.toFixed(3)}°C  →  ${deg}° rotation`,
          p.width / 2,
          p.height / 2 + Math.min(p.width, p.height) * 0.42
        );
      }

      // ── Waiting state ─────────────────────────────
      if (state.tempC === null) {
        p.fill(255, 255, 255, 40);
        p.noStroke();
        p.textFont('Courier New');
        p.textSize(11);
        p.textAlign(p.CENTER);
        p.text(
          state.wsConnected
            ? 'waiting for sensor data...'
            : 'connecting to router...',
          p.width / 2,
          p.height / 2
        );
        needsRedraw = true; // keep redrawing until data arrives
      }
    };

  });
  </script>
</body>
</html>

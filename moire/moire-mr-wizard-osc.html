<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>RF · moire</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fff; overflow: hidden; font-family: 'Courier New', monospace; }
    #canvas-container { position: fixed; inset: 0; }

    /* ── top bar ── */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5em;
      padding: 0.9em 1em;
      z-index: 20;
      pointer-events: none;
    }
    .btn {
      pointer-events: all;
      background: transparent;
      border: 1px solid rgba(0,0,0,0.18);
      color: rgba(0,0,0,0.38);
      font-family: 'Courier New', monospace;
      font-size: 0.58em;
      letter-spacing: 0.14em;
      padding: 0.35em 0.8em;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.12s;
    }
    .btn.active { background: #000; color: #fff; border-color: #000; }
    .btn:hover  { border-color: rgba(0,0,0,0.5); color: rgba(0,0,0,0.7); }
    .btn.active:hover { background: #222; }

    #panel-toggle {
      position: fixed;
      top: 0.9em;
      right: 1.1em;
      z-index: 21;
      pointer-events: all;
    }

    /* ── control panel ── */
    #panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 220px;
      height: 100vh;
      background: rgba(255,255,255,0.96);
      border-left: 1px solid rgba(0,0,0,0.08);
      padding: 3.5em 1.2em 1.2em;
      z-index: 19;
      display: flex;
      flex-direction: column;
      gap: 0;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.25s ease;
    }
    #panel.open { transform: translateX(0); }

    .panel-section {
      margin-bottom: 1.4em;
    }
    .panel-label {
      font-size: 0.5em;
      letter-spacing: 0.2em;
      color: rgba(0,0,0,0.3);
      text-transform: uppercase;
      margin-bottom: 0.8em;
      border-bottom: 1px solid rgba(0,0,0,0.07);
      padding-bottom: 0.4em;
    }
    .ctrl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.7em;
    }
    .ctrl-name {
      font-size: 0.5em;
      letter-spacing: 0.1em;
      color: rgba(0,0,0,0.45);
      text-transform: uppercase;
      flex: 1;
    }
    .ctrl-val {
      font-size: 0.5em;
      color: rgba(0,0,0,0.55);
      width: 3.5em;
      text-align: right;
      margin-left: 0.5em;
    }
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 2px;
      background: rgba(0,0,0,0.12);
      outline: none;
      margin-top: 0.2em;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #000;
      cursor: pointer;
    }

    /* ── HUD ── */
    #hud {
      position: fixed;
      bottom: 1.2em;
      left: 1.2em;
      color: rgba(0,0,0,0.2);
      font-size: 0.52em;
      letter-spacing: 0.12em;
      line-height: 2.1em;
      text-transform: uppercase;
      pointer-events: none;
    }
    #hud span { color: rgba(0,0,0,0.48); }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="topbar">
    <button class="btn active" onclick="setMode(0)">I · COMB</button>
    <button class="btn"        onclick="setMode(1)">II · MESH</button>
    <button class="btn"        onclick="setMode(2)">III · RINGS</button>
  </div>

  <button class="btn" id="panel-toggle" onclick="togglePanel()">LFO ▸</button>

  <div id="panel" class="open">
    <div class="panel-section">
      <div class="panel-label">LFO 1</div>
      <div class="ctrl-row">
        <div class="ctrl-name">Rate</div>
        <div class="ctrl-val" id="val-rate1">0.040</div>
      </div>
      <input type="range" id="rate1" min="0.005" max="0.4" step="0.001" value="0.04"
             oninput="setParam('rate1', +this.value)">

      <div class="ctrl-row" style="margin-top:0.6em">
        <div class="ctrl-name">Amplitude</div>
        <div class="ctrl-val" id="val-amp1">0.06</div>
      </div>
      <input type="range" id="amp1" min="0" max="0.6" step="0.005" value="0.06"
             oninput="setParam('amp1', +this.value)">
    </div>

    <div class="panel-section">
      <div class="panel-label">LFO 2 (beat)</div>
      <div class="ctrl-row">
        <div class="ctrl-name">Rate</div>
        <div class="ctrl-val" id="val-rate2">0.047</div>
      </div>
      <input type="range" id="rate2" min="0.005" max="0.4" step="0.001" value="0.047"
             oninput="setParam('rate2', +this.value)">

      <div class="ctrl-row" style="margin-top:0.6em">
        <div class="ctrl-name">Mix</div>
        <div class="ctrl-val" id="val-mix2">0.3</div>
      </div>
      <input type="range" id="mix2" min="0" max="1" step="0.01" value="0.3"
             oninput="setParam('mix2', +this.value)">
    </div>

    <div class="panel-section">
      <div class="panel-label">Sensor → LFO</div>
      <div class="ctrl-row">
        <div class="ctrl-name">Rate mod</div>
        <div class="ctrl-val" id="val-rateMod">3.0</div>
      </div>
      <input type="range" id="rateMod" min="0" max="10" step="0.1" value="3"
             oninput="setParam('rateMod', +this.value)">

      <div class="ctrl-row" style="margin-top:0.6em">
        <div class="ctrl-name">Amp mod</div>
        <div class="ctrl-val" id="val-ampMod">6.0</div>
      </div>
      <input type="range" id="ampMod" min="0" max="20" step="0.1" value="6"
             oninput="setParam('ampMod', +this.value)">

      <div class="ctrl-row" style="margin-top:0.6em">
        <div class="ctrl-name">Delta range</div>
        <div class="ctrl-val" id="val-deltaRange">2.0</div>
      </div>
      <input type="range" id="deltaRange" min="0.1" max="10" step="0.1" value="2"
             oninput="setParam('deltaRange', +this.value)">
    </div>

    <div class="panel-section">
      <div class="panel-label">Pattern</div>
      <div class="ctrl-row">
        <div class="ctrl-name">Spacing</div>
        <div class="ctrl-val" id="val-spacing">12</div>
      </div>
      <input type="range" id="spacing" min="4" max="40" step="1" value="12"
             oninput="setParam('spacing', +this.value)">

      <div class="ctrl-row" style="margin-top:0.6em">
        <div class="ctrl-name">Thickness</div>
        <div class="ctrl-val" id="val-thick">5</div>
      </div>
      <input type="range" id="thick" min="1" max="20" step="0.5" value="5"
             oninput="setParam('thick', +this.value)">

      <div class="ctrl-row" style="margin-top:0.6em">
        <div class="ctrl-name">Opacity A</div>
        <div class="ctrl-val" id="val-opA">200</div>
      </div>
      <input type="range" id="opA" min="20" max="255" step="1" value="200"
             oninput="setParam('opA', +this.value)">

      <div class="ctrl-row" style="margin-top:0.6em">
        <div class="ctrl-name">Opacity B</div>
        <div class="ctrl-val" id="val-opB">150</div>
      </div>
      <input type="range" id="opB" min="20" max="255" step="1" value="150"
             oninput="setParam('opB', +this.value)">
    </div>

    <div class="panel-section">
      <div class="panel-label">Delta center</div>
      <div class="ctrl-row">
        <div class="ctrl-name">Comb/mesh °</div>
        <div class="ctrl-val" id="val-deltaAngle">60</div>
      </div>
      <input type="range" id="deltaAngle" min="0" max="180" step="1" value="60"
             oninput="setParam('deltaAngle', +this.value)">

      <div class="ctrl-row" style="margin-top:0.6em">
        <div class="ctrl-name">Ring offset %</div>
        <div class="ctrl-val" id="val-deltaOffset">15</div>
      </div>
      <input type="range" id="deltaOffset" min="0" max="50" step="1" value="15"
             oninput="setParam('deltaOffset', +this.value)">

      <div class="ctrl-row" style="margin-top:0.6em">
        <div class="ctrl-name">Ring base %</div>
        <div class="ctrl-val" id="val-baseOffset">8</div>
      </div>
      <input type="range" id="baseOffset" min="0" max="40" step="1" value="8"
             oninput="setParam('baseOffset', +this.value)">
    </div>
  </div>

  <div id="hud">
    <div>TEMP  <span id="temp-val">--</span> °C</div>
    <div>BASE  <span id="base-val">--</span> °C</div>
    <div>DELTA <span id="delta-val">--</span></div>
    <div>LFO   <span id="lfo-val">--</span> Hz</div>
    <div>WS    <span id="ws-val">--</span></div>
  </div>

  <script>
  // ═══════════════════════════════════════════════════
  // PARAMS — live-editable, all panel controls write here
  // ═══════════════════════════════════════════════════

  const params = {
    rate1:       0.040,
    amp1:        0.06,
    rate2:       0.047,
    mix2:        0.3,
    rateMod:     3.0,
    ampMod:      6.0,
    deltaRange:  2.0,    // °C that maps to deltaNorm ±1
    spacing:     12,
    thick:       5,
    opA:         200,
    opB:         150,
    deltaAngle:  60,     // degrees max center shift for comb/mesh
    deltaOffset: 15,     // % of minDim max center shift for rings
    baseOffset:  8,      // % of minDim permanent ring offset
  };

  function setParam(key, val) {
    params[key] = val;
    document.getElementById('val-' + key).textContent =
      Number.isInteger(val) ? val : val.toFixed(3);
  }

  // ── Panel toggle ──────────────────────────────────

  let panelOpen = true;
  function togglePanel() {
    panelOpen = !panelOpen;
    document.getElementById('panel').classList.toggle('open', panelOpen);
    document.getElementById('panel-toggle').textContent = panelOpen ? 'LFO ◂' : 'LFO ▸';
  }

  // ── Mode ──────────────────────────────────────────

  let mode = 0;
  function setMode(m) {
    mode = m;
    document.querySelectorAll('.btn').forEach((b, i) => b.classList.toggle('active', i === m));
  }

  // ═══════════════════════════════════════════════════
  // SENSOR STATE
  // ═══════════════════════════════════════════════════

  const sensor = {
    tempC:           null,
    baseline:        null,
    baselineHistory: [],
    BASELINE_WINDOW: 20,
    delta:           0,
    deltaNorm:       0,
    wsConnected:     false
  };

  function updateBaseline(temp) {
    sensor.baselineHistory.push(temp);
    if (sensor.baselineHistory.length > sensor.BASELINE_WINDOW) sensor.baselineHistory.shift();
    sensor.baseline  = sensor.baselineHistory.reduce((a, b) => a + b, 0) / sensor.baselineHistory.length;
    sensor.delta     = (sensor.tempC ?? temp) - sensor.baseline;
    sensor.deltaNorm = Math.max(-1, Math.min(1, sensor.delta / params.deltaRange));
  }

  async function seedBaseline() {
    try {
      const res = await fetch(`https://${location.host || 'adrian-pi.tailc1f637.ts.net:3000'}/api/baseline`);
      if (!res.ok) return;
      const readings = await res.json();
      if (Array.isArray(readings)) {
        readings.slice(-sensor.BASELINE_WINDOW).forEach(r => {
          if (r.temp_c != null) sensor.baselineHistory.push(r.temp_c);
        });
        if (sensor.baselineHistory.length > 0) {
          sensor.baseline = sensor.baselineHistory.reduce((a, b) => a + b, 0) / sensor.baselineHistory.length;
          document.getElementById('base-val').textContent = sensor.baseline.toFixed(2);
        }
      }
    } catch (e) {}
  }
  seedBaseline();

  // ═══════════════════════════════════════════════════
  // WEBSOCKET
  // ═══════════════════════════════════════════════════

  const host = location.host || 'adrian-pi.tailc1f637.ts.net:3000';
  const ws   = new WebSocket(`wss://${host}`);
  ws.onopen  = () => { sensor.wsConnected = true;  document.getElementById('ws-val').textContent = 'connected'; };
  ws.onclose = () => { sensor.wsConnected = false; document.getElementById('ws-val').textContent = 'disconnected'; };
  ws.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);

      // AM2320 temperature from ESP32
      if (data.type === 'sensor' && data.name === 'esp32-am2320' &&
          data.param === 'temp_c' && data.value != null) {
        sensor.tempC = data.value;
        updateBaseline(data.value);
        document.getElementById('temp-val').textContent  = data.value.toFixed(2);
        document.getElementById('base-val').textContent  = sensor.baseline ? sensor.baseline.toFixed(2) : '--';
        document.getElementById('delta-val').textContent = sensor.delta.toFixed(3) + '°';
      }

      // Teensy → LFO params
      // Map your physical knobs/sliders to LFO parameters
      if (data.type === 'controller' || data.type === 'midi_upstream') {
        if (data.msgType === 'cc' && data.channel !== 6) {
          const norm = data.value / 127;
          switch (data.cc) {
            case 1: setParam('rate1', 0.005 + norm * 0.395); break; // Encoder 1 → LFO1 rate
            case 2: setParam('amp1',  norm * 0.4);            break; // Encoder 2 → LFO1 amplitude
            case 3: setParam('rate2', 0.005 + norm * 0.395); break; // Encoder 3 → LFO2 rate
            case 4: setParam('mix2',  norm);                  break; // Encoder 4 → LFO2 mix
            case 5: setParam('deltaRange', 0.5 + norm * 9.5); break; // Slider 1 → delta range
            case 6: setParam('deltaAngle', norm * 180);        break; // Slider 2 → delta center
          }
          // Sync sliders in panel to reflect new values
          ['rate1','amp1','rate2','mix2','deltaRange','deltaAngle'].forEach(key => {
            const el = document.getElementById(key);
            if (el) el.value = params[key];
          });
        }
      }

    } catch (e) {}
  };

  // ═══════════════════════════════════════════════════
  // LFO ENGINE
  // ═══════════════════════════════════════════════════

  const lfo = {
    phase1: 0,
    phase2: 0,
    out1:   0,
    out2:   0,
    rate1:  0,
    amp:    0,

    update(dt, deltaNorm) {
      const abs = Math.abs(deltaNorm);
      this.rate1 = params.rate1 * (1 + abs * params.rateMod);
      const rate2 = params.rate2 * (1 + abs * params.rateMod * 1.3);
      this.amp   = params.amp1  * (1 + abs * params.ampMod);

      this.phase1 += this.rate1 * dt * Math.PI * 2;
      this.phase2 += rate2      * dt * Math.PI * 2;

      this.out1 = Math.sin(this.phase1);
      this.out2 = Math.sin(this.phase2);

      document.getElementById('lfo-val').textContent = this.rate1.toFixed(3);
    }
  };

  // ═══════════════════════════════════════════════════
  // P5
  // ═══════════════════════════════════════════════════

  new p5((p) => {
    let lastTime       = 0;
    let angleSmoothed  = 0;
    let offsetSmoothed = 0;

    p.setup = () => {
      p.createCanvas(p.windowWidth, p.windowHeight).parent('canvas-container');
      p.frameRate(30);
      lastTime = performance.now();
    };
    p.windowResized = () => p.resizeCanvas(p.windowWidth, p.windowHeight);

    function drawComb(angle) {
      const sp = params.spacing;
      const th = params.thick;
      const cx = p.width / 2, cy = p.height / 2;
      const diag  = Math.sqrt(p.width * p.width + p.height * p.height);
      const count = Math.ceil(diag / sp) + 2;
      p.background(255);
      p.noStroke();
      p.fill(0, 0, 0, params.opA);
      for (let i = -count; i <= count; i++) p.rect(cx + i * sp - th / 2, 0, th, p.height);
      p.fill(0, 0, 0, params.opB);
      p.push(); p.translate(cx, cy); p.rotate(angle);
      for (let i = -count; i <= count; i++) p.rect(i * sp - th / 2, -diag, th, diag * 2);
      p.pop();
    }

    function drawMesh(angle) {
      const sp = params.spacing;
      const th = params.thick;
      const cx = p.width / 2, cy = p.height / 2;
      const diag  = Math.sqrt(p.width * p.width + p.height * p.height);
      const count = Math.ceil(diag / sp) + 2;
      p.background(255);
      p.noStroke();
      p.fill(0, 0, 0, params.opA);
      for (let i = -count; i <= count; i++) {
        p.rect(cx + i * sp - th / 2, 0, th, p.height);
        p.rect(0, cy + i * sp - th / 2, p.width, th);
      }
      p.fill(0, 0, 0, params.opB);
      p.push(); p.translate(cx, cy); p.rotate(angle);
      for (let i = -count; i <= count; i++) {
        p.rect(i * sp - th / 2, -diag, th, diag * 2);
        p.rect(-diag, i * sp - th / 2, diag * 2, th);
      }
      p.pop();
    }

    function drawRings(offset) {
      const sp   = params.spacing;
      const th   = params.thick;
      const cx   = p.width / 2, cy = p.height / 2;
      const diag = Math.sqrt(p.width * p.width + p.height * p.height);
      const rings = Math.ceil(diag / sp) + 1;
      p.background(255);
      p.noFill();
      p.strokeWeight(th * 0.4);
      p.stroke(0, 0, 0, params.opA);
      for (let i = 1; i <= rings; i++) p.ellipse(cx, cy, i * sp * 2, i * sp * 2);
      const ox = cx + offset;
      p.stroke(0, 0, 0, params.opB);
      for (let i = 1; i <= rings; i++) p.ellipse(ox, cy, i * sp * 2, i * sp * 2);
      p.noStroke();
      p.fill(0, 0, 0, 60);
      p.ellipse(cx, cy, 5, 5);
      p.fill(80, 80, 80, 80);
      p.ellipse(ox, cy, 5, 5);
      p.stroke(0, 0, 0, 15);
      p.strokeWeight(0.5);
      p.line(cx, cy, ox, cy);
    }

    function drawStatus(angle, offset) {
      p.noStroke();
      p.textFont('Courier New');
      p.textAlign(p.CENTER);
      p.textSize(9);
      if (sensor.tempC !== null && sensor.baseline !== null) {
        p.fill(0, 0, 0, 16);
        const label = mode === 2
          ? `Δ ${sensor.delta >= 0 ? '+' : ''}${sensor.delta.toFixed(3)}°C  ·  ${offset.toFixed(1)}px offset`
          : `Δ ${sensor.delta >= 0 ? '+' : ''}${sensor.delta.toFixed(3)}°C  ·  ${(angle * 180 / Math.PI).toFixed(2)}° rotation`;
        p.text(label, p.width / 2, p.height - 50);
      } else {
        p.fill(0, 0, 0, 26);
        p.textSize(10);
        p.text(sensor.wsConnected ? 'waiting for sensor data...' : 'connecting...', p.width / 2, p.height / 2);
      }
    }

    // ── Derived signals — emitted back to router ─────
    //
    // Four signals computed from the sketch's internal state,
    // not present in the raw sensor data.
    // Sent as MIDI CC on channel 6, CC 1-4.
    // Router broadcasts to all clients — SC, VCV, other sketches.
    //
    // CC1 — LFO phase (0-1, position in oscillation cycle)
    // CC2 — interference intensity (0-1, how much layers overlap)
    // CC3 — beating envelope (0-1, slow AM from LFO1×LFO2 interaction)
    // CC4 — rate of change (0-1, how fast the pattern is moving)

    const derived = {
      phase:         0,
      interference:  0,
      beating:       0,
      rateOfChange:  0,
      prevAngle:     0,  // for rate of change calculation
    };

    // Emit derived signals to router at 20Hz
    setInterval(() => {
      if (ws.readyState !== 1) return;

    const signals = [
      { cc: 1, value: derived.phase,        device: 'moire/phase' },
      { cc: 2, value: derived.interference, device: 'moire/interference' },
      { cc: 3, value: derived.beating,      device: 'moire/beating' },
      { cc: 4, value: derived.rateOfChange, device: 'moire/rate' },
    ];

    signals.forEach(({ cc, value, device }) => {
      ws.send(JSON.stringify({
        type:    'midi_upstream',
        device,
        source:  location.host || 'moire',
        msgType: 'cc',
        channel: 6,
        cc,
        value:   Math.round(Math.max(0, Math.min(1, value)) * 127),
        raw:     [0xB5, cc, Math.round(value * 127)]
      }));
    });

    }, 50);

    p.draw = () => {
      const now = performance.now();
      const dt  = Math.min((now - lastTime) / 1000, 0.1);
      lastTime  = now;

      lfo.update(dt, sensor.deltaNorm);

      // Comb/mesh angle — LFO oscillates around delta center
      const lfoAngle    = lfo.amp * (lfo.out1 + params.mix2 * lfo.out2);
      const deltaCenter = sensor.deltaNorm * (params.deltaAngle * Math.PI / 180);
      const targetAngle = lfoAngle + deltaCenter;
      angleSmoothed    += (targetAngle - angleSmoothed) * 0.06;

      // Rings offset — LFO oscillates around delta center + base
      const minDim       = Math.min(p.width, p.height);
      const baseOffPx    = minDim * params.baseOffset / 100;
      const lfoOffPx     = minDim * lfo.amp * 0.8 * (lfo.out1 + params.mix2 * 0.5 * lfo.out2);
      const deltaOffPx   = sensor.deltaNorm * minDim * params.deltaOffset / 100;
      const targetOffset = baseOffPx + lfoOffPx + deltaOffPx;
      offsetSmoothed    += (targetOffset - offsetSmoothed) * 0.06;

      // ── Compute derived signals ───────────────────

      // CC1 — LFO phase: where in the cycle are we right now?
      // Map sin output (-1 to +1) → (0 to 1)
      derived.phase = (lfo.out1 + 1) / 2;

      // CC2 — Interference intensity: how much do the two layers overlap?
      // When angle difference is near 0 or π, lines align → max interference
      // When angle difference is near π/2, lines are perpendicular → min interference
      // Use |cos(angle)| as a proxy — peaks when aligned, troughs when perpendicular
      derived.interference = Math.abs(Math.cos(angleSmoothed * 2));

      // CC3 — Beating envelope: slow AM from two LFOs at slightly different rates
      // Multiply the two outputs — product oscillates at the difference frequency
      // This is exactly audio beating: f_beat = |f1 - f2|
      const beatRaw = (lfo.out1 * lfo.out2 + 1) / 2; // 0-1
      derived.beating = beatRaw;

      // CC4 — Rate of change: how fast is the pattern moving right now?
      // Derivative of angle with respect to time, normalized
      const angleDelta = Math.abs(angleSmoothed - derived.prevAngle);
      derived.rateOfChange = Math.min(1, angleDelta / (0.05 * dt)); // normalize
      derived.prevAngle    = angleSmoothed;

      switch (mode) {
        case 0: drawComb(angleSmoothed);   break;
        case 1: drawMesh(angleSmoothed);   break;
        case 2: drawRings(offsetSmoothed); break;
      }
      drawStatus(angleSmoothed, offsetSmoothed);
    };
  });
  </script>
</body>
